<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רשם החברות המלא - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="מאגר חברות מלא">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --accent-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .app-container {
            max-width: 850px;
            margin: 30px auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgb(0 0 0 / 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .app-version {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            background-color: var(--border);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .search-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-search {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-search:hover {
            background-color: var(--primary-hover);
        }

        .loader-container {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .company-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-right: 6px solid var(--primary);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            box-shadow: 0 2px 5px rgb(0 0 0 / 0.02);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .card-header h3 {
            font-size: 21px;
            color: var(--text-main);
        }

        .badge-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            white-space: nowrap;
        }

        .badge-active { background-color: #dcfce7; color: #15803d; }
        .badge-inactive { background-color: #f1f5f9; color: #475569; }
        .badge-danger { background-color: #fee2e2; color: #b91c1c; }
        .badge-gov { background-color: #e0f2fe; color: #0369a1; }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin: 16px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-right: 3px solid var(--primary);
            padding-right: 6px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px 20px;
            font-size: 14px;
            background-color: var(--accent-bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .info-item {
            color: var(--text-muted);
            line-height: 1.5;
        }

        .info-item strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>רשם החברות - פרופיל נתונים מלא</h1>
        <div class="app-version">גרסה 2.2.0 (מאגר שדות מלא)</div>
        <p>שאילתת נתונים מקיפה הכוללת זיהוי, סטטוס משפטי, כתובות וקודי מערכת</p>
    </header>

    <div class="search-group">
        <input type="text" id="searchInput" class="search-input" placeholder="הזן שם חברה, מספר חברה (ח.פ) או מילת מפתח..." autofocus>
        <button onclick="searchCompany()" class="btn-search">חפש</button>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div style="font-size: 14px; color: var(--text-muted);">שולף פרופיל נתונים מורחב משרתי הממשלה...</div>
    </div>

    <div id="results" class="results-list"></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('Service Worker הופעל בהצלחה');
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                window.location.reload();
                            }
                        });
                    });
                })
                .catch(err => console.error('רישום ה-SW נכשל:', err));
        });
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchCompany();
        }
    });

    async function searchCompany() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsDiv = document.getElementById('results');
        const loader = document.
