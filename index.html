<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רשם החברות המלא - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="מאגר חברות">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --accent-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--background); color: var(--text-main); padding: 20px; line-height: 1.5; }
        .app-container { max-width: 850px; margin: 30px auto; background: var(--surface); padding: 30px; border-radius: 14px; box-shadow: 0 4px 10px rgb(0 0 0 / 0.08); }
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 20px; }
        header h1 { font-size: 26px; color: var(--primary); margin-bottom: 4px; }
        .app-version { display: inline-block; font-size: 13px; font-weight: bold; background-color: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 12px; margin-bottom: 10px; }
        header p { font-size: 14px; color: var(--text-muted); }
        .search-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 14px 16px; font-size: 16px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .search-input:focus { border-color: var(--primary); }
        .btn-search { background-color: var(--primary); color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; }
        .btn-search:hover { background-color: var(--primary-hover); }
        .loader-container { display: none; text-align: center; margin: 30px 0; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-message { display: none; background-color: #fef2f2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid #fee2e2; }
        .company-card { background: var(--surface); border: 1px solid var(--border); border-right: 6px solid var(--primary); padding: 24px; border-radius: 8px; margin-bottom: 24px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
        .card-header h3 { font-size: 21px; color: var(--text-main); }
        .badge { display: inline-block; padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 20px; }
        .badge-active { background-color: #dcfce7; color: #15803d; }
        .badge-danger { background-color: #fee2e2; color: #b91c1c; }
        .badge-gov { background-color: #e0f2fe; color: #0369a1; }
        .section-title { font-size: 15px; font-weight: 700; color: var(--primary); margin: 16px 0 8px 0; border-right: 3px solid var(--primary); padding-right: 8px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 20px; font-size: 14px; background-color: var(--accent-bg); padding: 14px; border-radius: 6px; border: 1px solid var(--border); }
        .info-item { color: var(--text-muted); }
        .info-item strong { color: var(--text-main); font-weight: 600; }
        .full-width { grid-column: 1 / -1; }
        .no-results { text-align: center; color: var(--text-muted); padding: 40px; font-size: 16px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>רשם החברות - פרופיל מלא</h1>
        <div class="app-version">גרסה 2.3.0 (סנכרון מלא 29 שדות)</div>
        <p>שאילתת נתונים מקיפה ממאגר data.gov.il</p>
    </header>

    <div class="search-group">
        <input type="text" id="searchInput" class="search-input" placeholder="הזן שם חברה, מספר ח.פ או מילת מפתח..." autofocus>
        <button onclick="searchCompany()" class="btn-search">חפש</button>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div style="font-size: 14px; color: var(--text-muted);">מעבד נתונים מול השרת הממשלתי...</div>
    </div>

    <div id="results" class="results-list"></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW רשום בהצלחה'))
                .catch(err => console.error('שגיאה ברישום SW:', err));
        });
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchCompany();
    });

    async function searchCompany() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsDiv = document.getElementById('results');
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('errorMessage');
        
        resultsDiv.innerHTML = '';
        errorDiv.style.display = 'none';

        if (!query) {
            errorDiv.innerText = 'אנא הזן ערך לחיפוש.';
            errorDiv.style.display = 'block';
            return;
        }

        loader.style.display = 'block';

        const resourceId = 'f004176c-b85f-4542-8901-7b3176f9a054';
        const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=${resourceId}&q=${encodeURIComponent(query)}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Network response was not ok');
            
            const data = await response.json();
            const records = data.result.records;

            loader.style.display = 'none';

            if (!records || records.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">לא נמצאו חברות התואמות לחיפוש שלך.</div>';
                return;
            }

            records.forEach(company => {
                const card = document.createElement('div');
                card.className = 'company-card';
                
                // פונקציית עזר לשליפת השדות בצורה בטוחה (מטפלת במקרי Null/Undefined)
                const getField = (key) => company[key] || company[key.replace(/ /g, "_")] || 'אין נתון';

                // --- 1. זיהוי בסיסי ---
                const compId = getField("מספר חברה");
                const compName = getField("שם חברה");
                const engName = getField("שם באנגלית");
                const compType = company["סוג תאגיד"] || company["סוג_תאגיד"] || company["סוג חברה"] || 'אין נתון';
                const compStatus = getField("סטטוס חברה");
                const compDesc = company["תיאור חברה"] || company["תאור חברה"] || 'אין נתון';
                const compGoal = getField("מטרת החברה");
                const compDate = getField("תאריך התאגדות");
                const isGov = getField("חברה ממשלתית");
                const limitations = getField("מגבלות");
                const isViolator = company["מפרה"] || company["מפרה חוק"] || 'אין נתון';
                const lastReportYear = getField("שנה אחרונה של דוח שנתי");
                
                // --- 2. כתובות ---
                const cityName = company["שם עיר"] || company["יישוב"] || 'אין נתון';
                const streetName = company["שם רחוב"] || company["רחוב"] || 'אין נתון';
                const houseNum = getField("מספר בית");
                const zipCode = getField("מיקוד");
                const poBox = company["ת.ד."] || company["תא דואר"] || 'אין נתון';
                const country = getField("מדינה");
                const careOf = getField("אצל");
                
                // --- 3. קודים ותת-סטטוס ---
                const subStatus = getField("תת סטטוס");
                const codeStatus = getField("קוד סטטוס חברה");
                const codeType = getField("קוד סוג חברה");
                const codeClassification = getField("קוד סיווג חברה");
                const codeGoal = getField("קוד מטרת החברה");
                const codeLimitation = getField("קוד מגבלה");
                const codeViolator = getField("קוד חברה מפרה");
                const codeCity = getField("קוד ישוב");
                const codeStreet = getField("קוד רחוב");
                const codeCountry = getField("קוד מדינה");

                // קביעת צבעי תגיות
                let statusClass = 'badge-inactive';
                if (compStatus.includes('פעילה')) statusClass = 'badge-active';
                if (isViolator.includes('כן') || isViolator.includes('מפרה')) statusClass = 'badge-danger';

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <h3>${compName}</h3>
                            ${engName !== 'אין נתון' ? `<span style="font-size:13px; color:var(--text-muted);">שם באנגלית: ${engName}</span>` : ''}
                        </div>
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <span class="badge ${statusClass}">${compStatus}</span>
                            ${isViolator.includes('כן') ? '<span class="badge badge-danger">מפרה חוק</span>' : ''}
                            ${isGov.includes('כן') ? '<span class="badge badge-gov">ממשלתית</span>' : ''}
                        </div>
                    </div>
                    
                    <div class="section-title">פרטי זיהוי וסטטוס</div>
                    <div class="info-grid">
                        <div class="info-item"><strong>מספר חברה:</strong> ${compId}</div>
                        <div class="info-item"><strong>תאריך התאגדות:</strong> ${compDate}</div>
                        <div class="info-item"><strong>סוג תאגיד:</strong> ${compType}</div>
                        <div class="info-item"><strong>תת סטטוס:</strong> ${subStatus}</div>
                        <div class="info-item"><strong>שנת דוח אחרון:</strong> ${lastReportYear}</div>
                        <div class="info-item"><strong>מפרה:</strong> ${isViolator}</div>
                        <div class="info-item full-width"><strong>תיאור חברה:</strong> ${compDesc}</div>
                        <div class="info-item full-width"><strong>מטרת החברה:</strong> ${compGoal}</div>
                        <div class="info-item full-width"><strong>מגבלות:</strong> ${limitations}</div>
                    </div>

                    <div class="section-title">כתובת ומענה רשמי</div>
                    <div class="info-grid">
                        <div class="info-item"><strong>עיר / יישוב:</strong> ${cityName}</div>
                        <div class="info-item"><strong>רחוב:</strong> ${streetName}</div>
                        <div class="info-item"><strong>מספר בית:</strong> ${houseNum !== 'אין נתון' ? houseNum : 'לא צויין'}</div>
                        <div class="info-item"><strong>מיקוד:</strong> ${zipCode}</div>
                        <div class="info-item"><strong>ת.ד.:</strong> ${poBox}</div>
                        <div class="info-item"><strong>מדינה:</strong> ${country}</div>
                        <div class="info-item"><strong>אצל:</strong> ${careOf}</div>
                    </div>

                    <div class="section-title">קודים מערכתיים</div>
                    <div class="info-grid">
                        <div class="info-item"><strong>קוד סטטוס:</strong> ${codeStatus}</div>
                        <div class="info-item"><strong>קוד סוג חברה:</strong> ${codeType}</div>
                        <div class="info-item"><strong>קוד סיווג:</strong> ${codeClassification}</div>
                        <div class="info-item"><strong>קוד מטרה:</strong> ${codeGoal}</div>
                        <div class="info-item"><strong>קוד מגבלה:</strong> ${codeLimitation}</div>
                        <div class="info-item"><strong>קוד מפרה:</strong> ${codeViolator}</div>
                        <div class="info-item"><strong>קוד ישוב:</strong> ${codeCity}</div>
                        <div class="info-item"><strong>קוד רחוב:</strong> ${codeStreet}</div>
                        <div class="info-item"><strong>קוד מדינה:</strong> ${codeCountry}</div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });

        } catch (error) {
            loader.style.display = 'none';
            errorDiv.innerText = 'אירעה שגיאה בקבלת הנתונים. נסה שוב.';
            errorDiv.style.display = 'block';
        }
    }
</script>
</body>
</html>
