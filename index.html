<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רשם החברות המורחב - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="מידע חברות">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .app-container {
            max-width: 750px;
            margin: 30px auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgb(0 0 0 / 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .app-version {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            background-color: var(--border);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .search-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-search {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-search:hover {
            background-color: var(--primary-hover);
        }

        .loader-container {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .company-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-right: 6px solid var(--primary);
            padding: 22px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .company-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgb(0 0 0 / 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 10px;
        }

        .card-header h3 {
            font-size: 19px;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            white-space: nowrap;
        }

        .badge-active { background-color: #dcfce7; color: #15803d; }
        .badge-inactive { background-color: #f1f5f9; color: #475569; }
        .badge-danger { background-color: #fee2e2; color: #b91c1c; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px 20px;
            font-size: 14px;
        }

        .info-item {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .info-item strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>רשם החברות - מידע תאגידי מורחב</h1>
        <div class="app-version">גרסה 2.1.0 (עדכון מורחב)</div>
        <p>חיפוש ואיתור מידע מקיף ממאגר הנתונים הממשלתי הפתוח</p>
    </header>

    <div class="search-group">
        <input type="text" id="searchInput" class="search-input" placeholder="הזן שם חברה, מספר חברה (ח.פ) או מילת מפתח..." autofocus>
        <button onclick="searchCompany()" class="btn-search">חפש</button>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div style="font-size: 14px; color: var(--text-muted);">מבצע שליפת נתונים מורחבים מ-Gov.il...</div>
    </div>

    <div id="results" class="results-list"></div>
</div>

<script>
    // רישום ה-Service Worker וניהול רענון אוטומטי בעת עדכון גרסה
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('Service Worker רשום בהצלחה');
                    
                    // זיהוי אם יש Service Worker חדש שממתין, והפעלתו מיד
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('נמצא קוד חדש - מבצע רענון לעדכון האפליקציה...');
                                window.location.reload();
                            }
                        });
                    });
                })
                .catch(err => console.error('רישום ה-SW נכשל:', err));
        });
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchCompany();
        }
    });

    async function searchCompany() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsDiv = document.getElementById('results');
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('errorMessage');
        
        resultsDiv.innerHTML = '';
        errorDiv.style.display = 'none';

        if (!query) {
            errorDiv.innerText = 'אנא הזן שם חברה, מספר ח.פ או מילת מפתח לחיפוש.';
            errorDiv.style.display = 'block';
            return;
        }

        loader.style.display = 'block';

        const resourceId = 'f004176c-b85f-4542-8901-7b3176f9a054';
        const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=${resourceId}&q=${encodeURIComponent(query)}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('שגיאה בתקשורת מול השרת הממשלתי.');
            
            const data = await response.json();
            const records = data.result.records;

            loader.style.display = 'none';

            if (!records || records.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">לא נמצאו תוצאות התואמות לחיפוש שלך.</div>';
                return;
            }

            records.forEach(company => {
                const card = document.createElement('div');
                card.className = 'company-card';
                
                // שליפת שדות מותאמת לשמות העמודות העדכניים במאגר
                const compName = company["שם חברה"] || company["שם_חברה"] || 'לא צוין שם';
                const engName = company["שם באנגלית"] || company["שם_באנגלית"] || '';
                const compId = company["מספר חברה"] || company["מספר_חברה"] || 'אין נתון';
                const compStatus = company["סטטוס חברה"] || company["סטטוס_חברה"] || 'אין נתון';
                const compDate = company["תאריך התאגדות"] || company["תאריך_התאגדות"] || 'אין נתון';
                const compType = company["סוג חברה"] || company["סוג_חברה"] || 'אין נתון';
                const compSubType = company["תת סוג"] || company["תת_סוג"] || 'אין נתון';
                const compGoal = company["מטרת החברה"] || company["מטרת_החברה"] || 'לא צוין';
                const isViolator = company["מפרה חוק"] || company["מפרה_חוק"] || 'לא';
                
                // עיבוד פרטי כתובת מלאים
                const city = company["יישוב"] || company["ישוב"] || '';
                const street = company["רחוב"] || '';
                const houseNum = company["מספר בית"] || company["מספר_בית"] || '';
                const zip = company["מיקוד"] || '';
                const poBox = company["תא דואר"] || company["תא_דואר"] || '';
                
                let fullAddress = 'לא צוינה כתובת רשמית';
                if (city || street) {
                    fullAddress = `${street} ${houseNum}, ${city} ${zip ? `(מיקוד: ${zip})` : ''} ${poBox ? `[ת"ד: ${poBox}]` : ''}`.trim();
                }

                // הגדרת קלאס עיצובי לפי סטטוס
                let statusBadgeClass = 'badge-inactive';
                if (compStatus.includes('פעילה')) statusBadgeClass = 'badge-active';
                if (isViolator.includes('כן') || isViolator.includes('מפרה')) statusBadgeClass = 'badge-danger';

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <h3>${compName}</h3>
                            ${engName ? `<span style="font-size:13px; color:var(--text-muted); display:block; margin-top:2px;">${engName}</span>` : ''}
                        </div>
                        <span class="badge ${statusBadgeClass}">
                            ${compStatus} ${isViolator.includes('כן') ? '| מפרה חוק' : ''}
                        </span>
                    </div>
                    <div class="info-grid">
                        <div class="info-item"><strong>ח.פ / מספר תאגיד:</strong> ${compId}</div>
                        <div class="info-item"><strong>תאריך התאגדות:</strong> ${compDate}</div>
                        <div class="info-item"><strong>סוג ישות:</strong> ${compType}</div>
                        <div class="info-item"><strong>תת סוג:</strong> ${compSubType}</div>
                        <div class="info-item full-width"><strong>כתובת רשומה:</strong> ${fullAddress}</div>
                        <div class="info-item full-width"><strong>מטרת החברה:</strong> ${compGoal}</div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });

        } catch (error) {
            loader.style.display = 'none';
            errorDiv.innerText = 'אירעה שגיאה בקבלת הנתונים מהשרת. ודא שאתה מחובר לאינטרנט ונסה שוב.';
            errorDiv.style.display = 'block';
            console.error(error);
        }
    }
</script>
</body>
</html>
